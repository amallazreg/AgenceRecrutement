
<div class="login-page">
  <!-- Illustration gauche -->
  <div class="login-illustration">
    <img src="/assets/job22.png" alt="Illustration de connexion" />
  </div>

  <!-- Formulaire droit -->
  <div class="login-card">
    <div class="logo">
      <img src="assets/logo.jpeg" alt="Logo NextStep AI" />
      <h1>NextStep </h1>
    </div>

    <h2>Login</h2>

<form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm, $event)" novalidate>
      <!-- Name -->
      <div class="form-group">
        <div class="input-icon">
          <i class="fa-solid fa-user"></i>
          <div class="input-group">
        <input 
          type="text" 
          id="name"
          name="name" 
          placeholder="Name"
          required
          [(ngModel)]="formData.name"
          #nameCtrl="ngModel">
     
      </div>
      </div>
         <div class="error" *ngIf="nameCtrl.invalid && nameCtrl.touched">
          <small>name required.</small>
        </div>
      </div>
      

      <!-- Mot de passe -->
      <div class="form-group">
        <div class="input-icon">
          <i class="fa fa-lock"></i>
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            placeholder="Password"
            required
            minlength="6"
            [(ngModel)]="formData.password"
            #passwordCtrl="ngModel"
          />
          <span class="toggle-password" (click)="togglePassword()">
            {{ showPassword ? '🙈' : '👁️' }}
          </span>
        </div>
        <div class="error" *ngIf="passwordCtrl.invalid && passwordCtrl.touched">
          <small *ngIf="passwordCtrl.errors?.['required']">Password required</small>
        </div>
      </div>

      <!-- Souvenir -->
      <div class="remember">
        <input type="checkbox" id="remember" [(ngModel)]="formData.remember" name="remember" />
        <label for="remember">Remember me</label>
      </div>

      <!-- Bouton -->
      <button type="submit" class="btn" [disabled]="!loginForm.valid">Log in</button>
    </form>

    <p class="signup-text">
      No account yet? <a routerLink="/auth/signup">Create an account</a>
    </p>

    <footer>© 2025 NextStep AI — All rights reserved</footer>
  </div>
</div>
