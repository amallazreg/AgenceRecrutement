<div class="login-page">
  <!-- Illustration gauche -->
  <div class="login-illustration">
    <img src="/assets/job22.png" alt="Illustration de connexion" />
  </div>

  <!-- Formulaire droit -->
  <div class="login-card">
    <div class="logo">
      <img src="assets/logo.jpeg" alt="Logo NextStep AI" />
      <h1>NextStep <span>AI</span></h1>
    </div>

    <h2>Connexion</h2>

    <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm)" novalidate>
      <!-- Email -->
      <div class="form-group">
        <div class="input-icon">
          <i class="fa fa-envelope"></i>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="Email"
            required
            [(ngModel)]="formData.email"
            #emailCtrl="ngModel"
          />
        </div>
        <div class="error" *ngIf="emailCtrl.invalid && emailCtrl.touched">
          <small *ngIf="emailCtrl.errors?.['required']">Email requis</small>
          <small *ngIf="emailCtrl.errors?.['email']">Format invalide</small>
        </div>
      </div>

      <!-- Mot de passe -->
      <div class="form-group">
        <div class="input-icon">
          <i class="fa fa-lock"></i>
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            name="password"
            placeholder="Mot de passe"
            required
            minlength="6"
            [(ngModel)]="formData.password"
            #passwordCtrl="ngModel"
          />
          <span class="toggle-password" (click)="togglePassword()">
            {{ showPassword ? '🙈' : '👁️' }}
          </span>
        </div>
        <div class="error" *ngIf="passwordCtrl.invalid && passwordCtrl.touched">
          <small *ngIf="passwordCtrl.errors?.['required']">Mot de passe requis</small>
        </div>
      </div>

      <!-- Souvenir -->
      <div class="remember">
        <input type="checkbox" id="remember" [(ngModel)]="formData.remember" name="remember" />
        <label for="remember">Se souvenir de moi</label>
      </div>

      <!-- Bouton -->
      <button type="submit" class="btn" [disabled]="!loginForm.valid">Se connecter</button>
    </form>

    <p class="signup-text">
      Pas encore de compte ? <a routerLink="/auth/signup">Créer un compte</a>
    </p>

    <footer>© 2025 NextStep AI — Tous droits réservés</footer>
  </div>
</div>
