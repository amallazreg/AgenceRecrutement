<div class="login-container">
  <!-- Section gauche avec illustration -->
  <div class="login-illustration">
      <img src="/next-step/src/assets/nextstep.jpg" alt="NextStep AI Logo">  </div>

  <!-- Section droite avec formulaire -->
  <div class="login-form">
    <div class="logo">
      <img src="assets/logo.png" alt="NextStep AI Logo">
      <h2>NextStep <span>AI</span></h2>
    </div>

    <h3>Connexion</h3>

    <form>
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Email" required>
      </div>

      <div class="input-group">
        <label for="password">Mot de passe</label>
        <input type="password" id="password" placeholder="Mot de passe" required>
      </div>

      <div class="remember">
        <input type="checkbox" id="remember">
        <label for="remember">Se souvenir de moi</label>
      </div>

      <button type="submit" class="btn">Se connecter</button>
    </form>

    <p class="signup-text">
      Pas encore de compte ? <a href="#">Créer un compte</a>
    </p>

    <footer>
      © 2025 NextStep – Tous droits réservés
    </footer>
  </div>
</div>
