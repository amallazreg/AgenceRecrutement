<div class="app-container">
<app-sidebar-acceuil></app-sidebar-acceuil>
<div class="login-container">
        <!-- Section Gauche - Illustration -->
        <div class="left-section">
            <div class="animated-bg">
                <div class="grid-pattern"></div>
                <div class="floating-shapes">
                    <div class="shape shape1"></div>
                    <div class="shape shape2"></div>
                    <div class="shape shape3"></div>
                </div>
            </div>
            
            <div class="left-content">
                <div class="illustration">
                    <div class="card-stack">
                        <div class="card card1">
                            <div class="card-icon">⚡</div>
                            <div class="card-text">Smart CV Matching</div>
                        </div>
                        <div class="card card2">
                            <div class="card-icon">🤖</div>
                            <div class="card-text">AI-Powered Selection</div>
                        </div>
                        <div class="card card3">
                            <div class="card-icon">📄</div>
                            <div class="card-text">Smart CV Matching</div>
                        </div>
                    </div>
                </div>
                <h1>NextStep AI</h1>
                <p>Revolutionize your recruitment with artificial intelligence</p>
            </div>
        </div>

        <!-- Section Droite - Formulaire -->
        <div class="right-section">
            <div class="login-card">
            

                <h2 class="login-title">Login</h2>

                <form #loginForm="ngForm" (ngSubmit)="onSubmit(loginForm, $event)" novalidate>

                    <div class="input-group">
                        <div class="input-wrapper">
                            <span class="input-icon">👤</span>
                            <input 
                                  type="text" 
                                  id="name"
                                  name="name" 
                                  placeholder="Name"
                                  required
                                  [(ngModel)]="formData.name"
                                  #nameCtrl="ngModel">      
                          </div>
                          <div class="error" *ngIf="nameCtrl.invalid && nameCtrl.touched">
                            <small>name required.</small>
                           </div>
                    </div>

                    <div class="input-group">
                        <div class="input-wrapper">
                            <span class="input-icon">🔒</span>
                              <input
                                  [type]="showPassword ? 'text' : 'password'"
                                  id="password"
                                  name="password"
                                  placeholder="Password"
                                  required
                                  minlength="6"
                                  [(ngModel)]="formData.password"
                                  #passwordCtrl="ngModel"
                                />
                                <span class="toggle-password" (click)="togglePassword()">
                                  {{ showPassword ? '🙈' : '👁️' }}
                                </span>
                        </div>
                         <div class="error" *ngIf="passwordCtrl.invalid && passwordCtrl.touched">
                         <small *ngIf="passwordCtrl.errors?.['required']">Password required</small>
        </div>
                    </div>

                    <div class="remember">
                         <input type="checkbox" id="accept" name="accept" [(ngModel)]="formData.acceptTerms" required>
                        <label for="accept">Remember me</label>
                   </div>

                   <button type="submit" class="btn" [disabled]="!loginForm.valid">Log in</button>

                    <div class="footer-text">
                        No account yet? <a href="/auth/signup" id="registerLink">Create an account</a>
                    </div>

                    <div class="copyright">
                        © 2025 NextStep AI — All rights reserved
                    </div>
                </form>
            </div>
        </div>
    </div>
    <script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.querySelector('.toggle-password');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.textContent = '🙈';
            } else {
                passwordInput.type = 'password';
                toggleIcon.textContent = '👁️';
            }
        }

        const form = document.getElementById('loginForm');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            const username = e.target[0].value;
            const password = document.getElementById('password').value;
            const remember = document.getElementById('remember').checked;

            console.log('Login attempt:', { username, password, remember });
            
            alert(`Connexion réussie!\nUtilisateur: ${username}`);
        });

        document.getElementById('registerLink').addEventListener('click', (e) => {
            e.preventDefault();
            alert('Redirection vers la page d\'inscription');
        });
    </script>
