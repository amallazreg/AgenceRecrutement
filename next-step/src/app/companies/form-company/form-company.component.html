<form class="company-form" [formGroup]="companyForm" (ngSubmit)="onSubmit()">
  <div class="form-grid">
    <!-- Informations de base -->
    <div class="form-section">
      <h3>Basic Information</h3>
      <div class="form-group">
        <label>Company Name *</label>
        <input type="text" formControlName="name" placeholder="Entrez le nom de la société">
        <div class="error-message" *ngIf="companyForm.get('name')?.invalid && companyForm.get('name')?.touched">
          Company name is required
        </div>
      </div>
      <div class="form-group">
        <label>Sector of activity *</label>
        <select formControlName="sector">
          <option value="">Select a sector</option>
          <option value="Technologie">Technology</option>
          <option value="Marketing">Marketing</option>
          <option value="Finance">Finance</option>
          <option value="Santé">Health</option>
          <option value="Education">Education</option>
          <option value="Commerce">Commerce</option>
          <option value="Industrie">Industry</option>
        </select>
        <div class="error-message" *ngIf="companyForm.get('sector')?.invalid && companyForm.get('sector')?.touched">
          Sector is required
        </div>
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea formControlName="description" placeholder="Description de la société" rows="3"></textarea>
      </div>
    </div>

    <!-- Contact -->
    <div class="form-section">
      <h3>Contact details</h3>
      <div class="form-row">
        <div class="form-group">
          <label>E-mail *</label>
          <input type="email" formControlName="email" placeholder="email@societe.com">
          <div class="error-message" *ngIf="companyForm.get('email')?.invalid && companyForm.get('email')?.touched">
            Invalid email
          </div>
        </div>
        <div class="form-group">
          <label>Phone *</label>
          <div class="phone-input">
            <select formControlName="phonePrefix" class="prefix-select">
              <option value="+33">+33</option>
              <option value="+32">+32</option>
              <option value="+41">+41</option>
              <option value="+49">+49</option>
            </select>
            <input type="tel" formControlName="phone" placeholder="1 23 45 67 89">
          </div>
          <div class="error-message" *ngIf="companyForm.get('phone')?.invalid && companyForm.get('phone')?.touched">
            Phone is required
          </div>
        </div>
      </div>
      <div class="form-group">
        <label>Website</label>
        <input type="url" formControlName="website" placeholder="https://www.example.com">
      </div>
      <div class="form-group">
        <label>Adresse complète</label>
        <textarea formControlName="fullAddress" placeholder="Adresse complète de la société" rows="2"></textarea>
      </div>
    </div>

    <!-- Manager HR -->
    <div class="form-section">
      <h3>Manager RH</h3>
      <div class="form-group">
        <label>Manager's name *</label>
        <input type="text" formControlName="hrManager" placeholder="Nom complet du manager">
        <div class="error-message" *ngIf="companyForm.get('hrManager')?.invalid && companyForm.get('hrManager')?.touched">
          Manager name is required
        </div>
      </div>
      <div class="form-group">
        <label>Manager's email *</label>
        <input type="email" formControlName="managerEmail" placeholder="manager@societe.com">
        <div class="error-message" *ngIf="companyForm.get('managerEmail')?.invalid && companyForm.get('managerEmail')?.touched">
          Invalid manager email
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Password *</label>
          <input type="password" formControlName="password" placeholder="Mot de passe">
          <div class="error-message" *ngIf="companyForm.get('password')?.invalid && companyForm.get('password')?.touched">
           Password must contain at least 6 characters
          </div>
        </div>
        <div class="form-group">
          <label>Confirmation *</label>
          <input type="password" formControlName="confirmPassword" placeholder="Confirmez le mot de passe">
          <div class="error-message" *ngIf="companyForm.get('confirmPassword')?.invalid && companyForm.get('confirmPassword')?.touched">
            Confirmation is required
          </div>
        </div>
      </div>
      <div class="error-message" *ngIf="companyForm.hasError('mismatch') && companyForm.get('confirmPassword')?.touched">
        Passwords do not match
      </div>
    </div>
  </div>

  <div class="form-actions">
    <button type="button" class="btn-outline" (click)="onCancel()">Cancel</button>
    <button type="submit" class="btn-primary" [disabled]="!companyForm.valid">
      <span class="material-icons">save</span>
      {{ companyData ? 'Modifier' : 'Create' }} Company
    </button>
  </div>
</form>
