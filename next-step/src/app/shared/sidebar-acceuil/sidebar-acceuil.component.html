<header>
  <nav>
    <div class="logo">
      <img src="assets/logo.jpeg" alt="Logo NextStep AI" />
      <span>NextStep</span>
    </div>
    
    <ul class="nav-links">
      <li><a routerLink="/acceuil">Home</a></li>
      <li><a href="#fonctionnalites">Features</a></li>
      <li><a href="#roles">Roles</a></li>

      <!-- ✅ If NOT logged in -->
           <ng-container *ngIf="isLoggedIn">
         <li><a routerLink="/offres">Offre disponible</a></li>
      </ng-container>
         <ng-container *ngIf="isLoggedIn">
         <li><a routerLink="/historique">Historique Candidatures</a></li>
      </ng-container>
      <ng-container *ngIf="!isLoggedIn">
        <li><a routerLink="/auth/signup" >Sign Up</a></li>
        <li><a routerLink="/auth/login" class="btn-signup">Sign In</a></li>
      </ng-container>

      <!-- ✅ If logged in -->
      <ng-container *ngIf="isLoggedIn">
        <li class="user-menu">
          <div class="user-icon" (click)="toggleUserMenu()">
                        <span class="toggle-icon">👤</span>
                         
            <svg class="chevron-icon" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="6 9 12 15 18 9"></polyline>
            </svg>
          </div>

          <ul class="dropdown" *ngIf="showUserMenu">
            <li class="user-info">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
              <strong>{{ userName }}</strong>
            </li>
            <li class="dropdown-item" (click)="viewProfile()">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M12 1v6m0 6v6m6-9h-6m-6 0h6"></path>
              </svg>
              View Profile
            </li>
            <li class="dropdown-divider"></li>
            <li class="dropdown-item logout" (click)="logout()">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                <polyline points="16 17 21 12 16 7"></polyline>
                <line x1="21" y1="12" x2="9" y2="12"></line>
              </svg>
              Logout
            </li>
          </ul>
        </li>
      </ng-container>
    </ul>
  </nav>
</header>
